<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <circle cx="50" cy="50" r="46" fill="none" stroke="#00965e" stroke-width="6"/>
  <!-- Cross background circle -->
  <circle cx="50" cy="50" r="43" fill="#003554"/>
  <!-- Bayer Cross Letters -->
  <g fill="#ffffff" font-family="'Inter', Arial, sans-serif" font-weight="900" font-size="13" text-anchor="middle" dominant-baseline="central">
    <!-- Vertical BAYER -->
    <text x="50" y="20">B</text>
    <text x="50" y="35">A</text>
    <text x="50" y="50">Y</text>
    <text x="50" y="65">E</text>
    <text x="50" y="80">R</text>
    <!-- Horizontal BAYER (Y is shared at 50,50) -->
    <text x="20" y="50">B</text>
    <text x="35" y="50">A</text>
    <text x="65" y="50">E</text>
    <text x="80" y="50">R</text>
  </g>
</svg>
